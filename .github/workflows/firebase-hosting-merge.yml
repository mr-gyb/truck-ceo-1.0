name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAf60UgNSyncGk-6j55UXjZ1U54IxJpIQU
          VITE_FIREBASE_AUTH_DOMAIN: truck-ceo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: truck-ceo
          VITE_FIREBASE_STORAGE_BUCKET: truck-ceo.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "419699908912"
          VITE_FIREBASE_APP_ID: 1:419699908912:web:24d85875480487de03e8f5

      # Driver app (added 2026-11-08): a separate Vite app in driver-app/,
      # shipped on this same hosting site at /driver/ (firebase.json routes
      # /driver/** to its index). It uses the same VITE_FIREBASE_* web config
      # as the owner app (same Firebase project), builds after the owner app,
      # and its dist is copied into dist/driver so one hosting deploy ships both.
      - run: npm ci --prefix driver-app && npm run build --prefix driver-app
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAf60UgNSyncGk-6j55UXjZ1U54IxJpIQU
          VITE_FIREBASE_AUTH_DOMAIN: truck-ceo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: truck-ceo
          VITE_FIREBASE_STORAGE_BUCKET: truck-ceo.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "419699908912"
          VITE_FIREBASE_APP_ID: 1:419699908912:web:24d85875480487de03e8f5
      - run: mkdir -p dist/driver && cp -r driver-app/dist/. dist/driver/

      # Functions deps must be installed in CI: the firebase.json predeploy hook
      # runs `npm --prefix functions run build` (tsc), which needs
      # functions/node_modules present. Without this step every type from
      # firebase-functions / firebase-admin / openai resolves to `any` and
      # the deploy aborts before touching production.
      - run: npm ci --prefix functions

      # Diag codebase deps (added 2026-11-07 for the functions2 bisect):
      # its predeploy tsc build needs functions2/node_modules present.
      - run: npm ci --prefix functions2

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/419699908912/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@truck-ceo.iam.gserviceaccount.com'

      # NOTE: the first Cloud Functions deploy requires the deployer service account
      # to hold these roles on the truck-ceo project (Chris approves once in the
      # GCP console: IAM & Admin -> IAM):
      #   roles/cloudfunctions.developer, roles/run.admin, roles/iam.serviceAccountUser
      # Functions deploy FIRST so that any new Cloud Run service referenced by a
      # hosting rewrite (e.g. /api/saveFeedCredentials -> savefeedcredentials)
      # exists before the hosting config is validated — otherwise the hosting
      # step fails with "Cloud Run service ... does not exist".
      - run: npx -y firebase-tools@latest deploy --only functions --force --project truck-ceo
      - run: npx -y firebase-tools@latest deploy --only hosting --project truck-ceo
      # Firestore rules deploy (added 2026-10-12, reordered + made non-blocking
      # the same day): the deployer service account currently lacks the
      # Firebaserules permission (403 on the rules test endpoint), so until
      # that IAM grant lands (roles/firebaserules.admin), a rules failure must
      # never block functions or hosting. firebase.json carries the firestore
      # section; rules also remain publishable from the Firebase console
      # (as done 2026-09-30).
      - name: Deploy Firestore rules (non-blocking)
        continue-on-error: true
        run: npx -y firebase-tools@latest deploy --only firestore:rules --project truck-ceo
      # Storage rules deploy (added 2026-11-07, non-blocking like the
      # Firestore rules step above): ships storage.rules, which
      # tenant-isolates businesses/{bid}/settlement-uploads and
      # businesses/{bid}/csv-uploads plus driver-photos/{bid}/... to
      # the business named in the caller's users doc. The deployer
      # service account's permission for Storage rules is unknown, so
      # until that is confirmed a failure here must never block
      # functions or hosting. NOTE: a successful run REPLACES the
      # console-configured Storage rules for the whole bucket —
      # storage.rules covers every client Storage path the app uses.
      - name: Deploy Storage rules (non-blocking)
        continue-on-error: true
        run: npx -y firebase-tools@latest deploy --only storage --project truck-ceo
